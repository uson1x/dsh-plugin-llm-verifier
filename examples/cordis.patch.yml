# Example profile patch layer inserting the LLM-as-a-Verifier plugin.
# Append the insert row to ~/.dsh/profiles/<profile>/cordis.patch.yml
# (or run dsh with --patch pointing at this file).

- insert:
    - id: llm-verifier
      name: dsh-plugin-llm-verifier
      config:
        provider: deepseek-official
        model: deepseek-v4-pro
        # reasoningEffort: 'off'     # much faster grading, slightly less careful
        # rollout:
        #   model: deepseek-v4-flash # cheaper model for rollout attempts
        # repetitions: 8             # more grading passes, better discrimination
        # judgeTrace: final          # judge only final messages (cheaper; default: full trajectories)
        # timeoutMs: 600000          # per-grading-call deadline (default 300000; timed-out calls retry once)
